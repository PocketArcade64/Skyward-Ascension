function normalize(rows){ let w=0; for(const r of rows) w=Math.max(w,r.length); return rows.map(r=> r + '.'.repeat(w-r.length)); }
function bake(rowsRaw,pal,mirror){
 const rows=normalize(rowsRaw),w=rows[0].length,h=rows.length,fw=mirror?w*2-1:w;
 const c=document.createElement('canvas'); c.width=fw; c.height=h; const cx=c.getContext('2d'),img=cx.createImageData(fw,h),d=img.data;
 const put=(x,y,ch)=>{ if(ch==='.'||ch===' ')return; const col=pal[ch]; if(!col)return; const i=(y*fw+x)*4; d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3]!==undefined?col[3]:255; };
 for(let y=0;y<h;y++){ const row=rows[y]; for(let x=0;x<w;x++){ const ch=row[x]; put(x,y,ch); if(mirror) put(fw-1-x,y,ch); } }
 cx.putImageData(img,0,0); return c;
}

function buildSprites(){
 SPR.dragon={}; for(const el of ['fire','ice','storm']){ const a=bake(DRAG_A,PAL['dragon_'+el],true),b=bake(DRAG_B,PAL['dragon_'+el],true); SPR.dragon[el]=[a,b,a]; } loadDragons();
 SPR.enemyA={}; for(const k in ENEMY_DEF){ const d=ENEMY_DEF[k]; SPR.enemyA[k]=[bake(d.a,d.p,true),bake(d.b,d.p,true)]; }
 SPR.boss={HEAD:bake(HEAD,PAL.boss,true),SEG:bake(SEG,PAL.boss,true),TAIL:bake(TAIL,PAL.boss,true)};

 SPR.proj={fire:bake(FIRE_P,PAL.fireB,true),ice:bake(ICE_P,PAL.iceB,true),storm:bake(BOLT_P,PAL.boltB,false),eshot:bake(ESHOT,PAL.eshot,true)};

}

const cv=document.getElementById('game'); ctx=cv.getContext('2d');
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth||document.documentElement.clientWidth||390;
 H=window.innerHeight||document.documentElement.clientHeight||780;
 /* On iOS standalone PWA, getBoundingClientRect on a position:fixed;inset:0 canvas
    reflects the true physical-screen bounds; use it only when it gives a *larger* value
    than innerHeight (the safe-area gap case).  On PC it equals innerHeight, so no change. */
 try{ const r=cv.getBoundingClientRect(); if(r.width>1&&r.width>W)W=r.width; if(r.height>1&&r.height>H)H=r.height; }catch(e){}
 cv.width=Math.max(1,Math.floor(W*DPR)); cv.height=Math.max(1,Math.floor(H*DPR));
 /* Explicit CSS size is required: without it the canvas display defaults to its attribute
    width (W*DPR pixels), overflowing the viewport and breaking mouse-coordinate mapping. */
 cv.style.width=W+'px'; cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=false;
 PX=Math.max(2,Math.min(4,Math.round(Math.min(W,H)/240)));
 try{window.__safeTop=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0;}catch(e){} }
['resize','orientationchange','pageshow'].forEach(e=>window.addEventListener(e,resize)); resize(); setTimeout(resize,150); setTimeout(resize,600);
window.onerror=function(m,s,l){ try{ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='rgba(50,0,0,0.92)'; ctx.fillRect(0,0,W,98); drawText('LOAD ERROR',8,10,1.8,'#ff9a9a','left'); drawText((''+m).slice(0,32),8,32,1.5,'#ffc0c0','left'); drawText((''+m).slice(32,64),8,48,1.5,'#ffc0c0','left'); drawText('LINE '+l,8,68,1.5,'#ffc0c0','left'); }catch(e){} return false; };

let actx=null,masterGain=null,musicGain=null,sfxGain=null,audioReady=false;
function initAudio(){ if(actx)return; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; actx=new AC();
  masterGain=actx.createGain(); masterGain.gain.value=0.5; masterGain.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.30; musicGain.connect(masterGain);
  sfxGain=actx.createGain(); sfxGain.gain.value=0.55; sfxGain.connect(masterGain);
  audioReady=true; startMusic(); }catch(e){} }
function resumeAudio(){ try{ if(actx&&actx.state==='suspended')actx.resume(); }catch(e){} }
function beep(freq,dur,type,vol,when,glideTo,dest){ if(!audioReady||!settings.sound)return; const t0=when||actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(t0); o.stop(t0+dur+0.02); }
function noiseBurst(dur,vol,filtType,filtFreq,when,dest){ if(!audioReady||!settings.sound)return; const t0=when||actx.currentTime;
  const n=Math.max(1,Math.floor(actx.sampleRate*dur)),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); const src=actx.createBufferSource(); src.buffer=buf;
  const g=actx.createGain(); g.gain.value=vol||0.2; const f=actx.createBiquadFilter(); f.type=filtType||'lowpass'; f.frequency.value=filtFreq||1200;
  src.connect(f); f.connect(g); g.connect(dest||sfxGain); src.start(t0); }
const _thr={};
function thr(k,ms){ const t=performance.now(); if(_thr[k]&&t-_thr[k]<ms)return false; _thr[k]=t; return true; }
function sfx(name,arg){ if(!audioReady||!settings.sound)return; const t=actx.currentTime;
 switch(name){
  case 'shoot': { if(!thr('shoot',45))return; const el=arg||'fire'; if(el==='fire')beep(300,0.09,'sawtooth',0.05,t,150); else if(el==='ice')beep(1100,0.07,'triangle',0.06,t,1650); else { beep(420,0.06,'square',0.06,t,1000); } break; }
  case 'hit': if(!thr('hit',35))return; beep(560,0.03,'square',0.04,t); break;
  case 'kill': beep(320,0.12,'square',0.1,t,90); noiseBurst(0.12,0.06,'lowpass',1400,t); break;
  case 'hurt': beep(170,0.2,'sawtooth',0.2,t,70); break;
  case 'block': beep(950,0.08,'square',0.11,t,1300); beep(1400,0.05,'square',0.06,t); break;
  case 'pickup': [523,659,880].forEach((f,i)=>beep(f,0.09,'square',0.11,t+i*0.05)); break;
  case 'shield': [660,990,1320].forEach((f,i)=>beep(f,0.08,'triangle',0.1,t+i*0.04)); break;
  case 'bomb': noiseBurst(0.5,0.3,'lowpass',900,t); beep(120,0.45,'sawtooth',0.18,t,40); break;
  case 'click': beep(720,0.04,'square',0.09,t); break;
  case 'upgrade': [523,659,784,1046].forEach((f,i)=>beep(f,0.28,'square',0.09,t+i*0.06)); break;
  case 'wave': [392,523,659].forEach((f,i)=>beep(f,0.16,'square',0.11,t+i*0.09)); break;
  case 'boss': beep(80,0.7,'sawtooth',0.24,t,52); noiseBurst(0.6,0.12,'lowpass',500,t); break;
  case 'bossHit': if(!thr('bossHit',45))return; beep(150,0.05,'square',0.09,t); break;
  case 'bossDeath': [520,440,360,280,200].forEach((f,i)=>beep(f,0.25,'square',0.14,t+i*0.1,f*0.7)); noiseBurst(0.9,0.22,'lowpass',700,t); break;
  case 'victory': [523,659,784,1046,1318].forEach((f,i)=>beep(f,0.3,'square',0.12,t+i*0.13)); break;
  case 'gameover': [440,392,330,262].forEach((f,i)=>beep(f,0.35,'triangle',0.16,t+i*0.18,f*0.85)); break;
 }

function openContinue(){ rebuildCont(); state='continue'; }
function victory(){ gameOver(true); }
function gameOver(win){ game.over=true; game.won=win; state='over'; sfx(win?'victory':'gameover'); }
function abandon(){ game=null; state='menu'; }
function startRun(){ game=newGame(selDragon,selMode); state='playing'; startStage(); }
function requestGyro(){ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){ DeviceOrientationEvent.requestPermission().catch(()=>{}); } }
/* ===== INPUT ROUTING ===== */
let pauseArmed=false, lastTap=0;
function pos(ev){ const t=ev.touches&&ev.touches[0]?ev.touches[0]:(ev.changedTouches&&ev.changedTouches[0]?ev.changedTouches[0]:ev); return {x:t.clientX,y:t.clientY}; }
function inRect(p,r){ return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function hitUI(p){ for(let i=clickables.length-1;i>=0;i--){ if(inRect(p,clickables[i])){ sfx('click'); clickables[i].on(); return true; } } return false; }
function uiTap(p){ initAudio(); resumeAudio(); const t=performance.now(); if(t-lastTap<260)return; lastTap=t; hitUI(p); }
function pdown(ev){ ev.preventDefault(); initAudio(); resumeAudio(); const q=pos(ev);
 if(state==='playing'){ if(inRect(q,pauseBtn)){ pauseArmed=true; return; }
   if(settings.ctrl==='joystick'){ inp.joyActive=true; inp.jbx=q.x; inp.jby=q.y; inp.jx=0; inp.jy=0; } else if(settings.ctrl==='follow'){ inp.active=true; inp.tx=q.x; inp.ty=q.y; } } }
function pmove(ev){ if(state!=='playing')return; ev.preventDefault(); const q=pos(ev);
 if(settings.ctrl==='joystick'&&inp.joyActive){ let dx=q.x-inp.jbx,dy=q.y-inp.jby; const d=Math.hypot(dx,dy)||1,m=Math.min(1,d/48); inp.jx=dx/d*m; inp.jy=dy/d*m; }
 else if(settings.ctrl==='follow'){ inp.active=true; inp.tx=q.x; inp.ty=q.y; } }
function pup(ev){ const q=pos(ev);
 if(state==='playing'){ if(pauseArmed){ pauseArmed=false; if(inRect(q,pauseBtn)){ state='paused'; inp.active=false; inp.joyActive=false; return; } }
   if(settings.ctrl==='joystick'){ inp.joyActive=false; inp.jx=0; inp.jy=0; } else if(settings.ctrl==='follow'){ inp.active=false; } return; }
 uiTap(q); }
cv.addEventListener('touchstart',pdown,{passive:false}); cv.addEventListener('touchmove',pmove,{passive:false}); cv.addEventListener('touchend',pup); cv.addEventListener('touchcancel',pup);
cv.addEventListener('mousedown',pdown); window.addEventListener('mousemove',pmove); window.addEventListener('mouseup',pup);
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>window.addEventListener(ev,function(){ initAudio(); resumeAudio(); },{passive:true}));
window.addEventListener('click',ev=>{ if(state!=='playing') uiTap({x:ev.clientX,y:ev.clientY}); });
window.addEventListener('deviceorientation',ev=>{ if(settings.ctrl!=='gyro'||ev.beta===null)return; if(inp.gcalB===null){ inp.gcalB=ev.beta; inp.gcalG=ev.gamma; } inp.gx=Math.max(-1,Math.min(1,(ev.gamma-inp.gcalG)/26)); inp.gy=Math.max(-1,Math.min(1,(ev.beta-inp.gcalB)/26)); });

/* ===== LOOP ===== */
let last=performance.now();
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; uiT+=dt;
 try{
  if(state==='playing'&&game){ update(dt); }
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=false;
  if(state==='playing')renderGame(dt);
  else if(state==='paused')drawPause();
  else if(state==='menu')drawMenu();
  else if(state==='select')drawSelect();
  else if(state==='settings')drawSettings();
  else if(state==='upgrade')drawUpgrade();
  else if(state==='continue')drawContinue();
  else if(state==='over')drawOver();
  else drawMenu();
 }catch(e){ try{ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='rgba(50,0,0,0.92)'; ctx.fillRect(0,0,W,98); const m=''+((e&&e.message)||e); drawText('GAME ERROR',8,10,1.8,'#ff9a9a','left'); drawText(m.slice(0,32),8,32,1.5,'#ffc0c0','left'); drawText(m.slice(32,64),8,48,1.5,'#ffc0c0','left'); drawText('STATE '+state,8,68,1.5,'#ffc0c0','left'); }catch(_){} }
 requestAnimationFrame(loop); }

/* ===== INIT ===== */
function makeIcon(){ try{ const c=document.createElement('canvas'); c.width=180; c.height=180; const x=c.getContext('2d');
 const gr=x.createLinearGradient(0,0,0,180); gr.addColorStop(0,'#241a3a'); gr.addColorStop(1,'#0d0a18'); x.fillStyle=gr; x.fillRect(0,0,180,180); x.imageSmoothingEnabled=false;
 const spr=SPR.dragon.fire[0], sc=Math.floor(150/spr.height); x.drawImage(spr,90-spr.width*sc/2,90-spr.height*sc/2,spr.width*sc,spr.height*sc);
 const link=document.createElement('link'); link.rel='apple-touch-icon'; link.href=c.toDataURL('image/png'); document.head.appendChild(link); }catch(e){} }
buildSprites();
const origStartRun=startRun; startRun=function(){ inp.gcalB=null; origStartRun(); };
requestAnimationFrame(loop);
</script>
</body>
